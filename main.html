<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ticket System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<style>
    table {
        background-color: bisque;
        table-layout: fixed;
        border: 1px solid black;
        border-radius: 10px;
        border-collapse: separate; 
        border-spacing: 0;         
        overflow: hidden; 
    }

    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid black;
    }

    button {
        margin-bottom: 25px;
        color: white;
        padding: 10px 32px;
        font-size: 16px;
        background-color: #d40f0f;
        cursor: pointer;
        border-radius: 25px;
        border-width: 1px solid black;
    }

    /* ticket ID header and cells fixed width */
    th:nth-child(1),
    td:nth-child(1) {
        width: 100px;
    }

    /* Issue header and cells fixed width */
    th:nth-child(2),
    td:nth-child(2) {
        width: 250px;
    }

</style>

<body>
    <h1>Tickets</h1>

    <p>

    </p>

    <button type="button">Create Ticket</button>

    <table>
        <tr>
            <th>Ticket ID</th>
            <th>Issue</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Login issue</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Page not loading</td>
            <td>Closed</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Payment processing error</td>
            <td>In Progress</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>6</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>7</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>8</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>9</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>10</td>
            <td>Feature request</td>
            <td>Open</td>
        </tr>
</body>
</html>
